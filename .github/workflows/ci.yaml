name: CI Build    

on:
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with: 
          node-version: 18

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Build Application
        run: npm run build

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with: 
          name: nextjs-build
          path: .next/